packages:
  - .

nodeLinker: hoisted

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  # 0.1.3 起 dsh-session-persistence-jsonl 直接相依 fs-ext（flock，session 檔的
  # 獨佔鎖），必須真的建置；不放行的話 pnpm 會以 ERR_PNPM_IGNORED_BUILDS 失敗。
  fs-ext: true
  '@google/genai': false
  koffi: true
  node-addon-require-builtin: false
  node-pty: true
  protobufjs: false

patchedDependencies:
  '@deepseek-ai/dsh-session@0.1.3-alpha.2': patches/@deepseek-ai__dsh-session@0.1.3-alpha.2.patch
